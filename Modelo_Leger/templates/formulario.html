<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Leger</title>
    <link rel="stylesheet" type="text/css" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <h2>Ingrese de acuerdo a sus pruebas física</h2>
    <form action="/predecir" method="post">
        <select name="Sexo">
            <option value="Hombre">Hombre</option>
            <option value="Mujer">Mujer</option>
        </select>
        <select name="IMC_categoria">
            <option value="Bajo peso">Bajo peso</option>
            <option value="Peso normal">Peso normal</option>
            <option value="Sobrepeso">Sobrepeso</option>
            <option value="Obesidad">Obesidad</option>
        </select>
        <label>Salto largo</label>
        <input type="number" name="Salto_Largo">
        <label>30 m lanzados (s)</label>
        <input type="number" step="0.01" name="30_m">
        <label>IMC</label>
        <input type="number" step="0.01" name="IMC">
        <label>IA (Indice de Agilidad)</label>
        <input type="number" step="0.01" name="IA">
        <label>PR (Potencia Relativa)</label>
        <input type="number" step="0.01" name="PR">
        <input type="submit" value="Predecir ahorro">
</body>
</html>
